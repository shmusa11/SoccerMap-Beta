[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pythonProject1", "scratch", "output", "test_clips", "soccer-player-ball-tracker.v3i.yolov8"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"] # Mathematical geometry uses conventional single-letter names.
